<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Inventory Manager</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-brand">Inventory Manager</div>
        <nav>
          <button type="button" id="navDashboard" class="nav-link active">
            Dashboard
          </button>
          <button type="button" id="navPurchase" class="nav-link">
            Purchase
          </button>
          <button type="button" id="navSell" class="nav-link">Sell</button>
        </nav>
        <button type="button" id="logoutBtn" class="nav-link logout">
          Log out
        </button>
      </aside>

      <div id="sidebarOverlay" class="overlay"></div>

      <main class="main">
        <header class="topbar">
          <button type="button" id="menuToggle" class="menu-toggle">
            &#9776;
          </button>
          <h1>Dashboard</h1>
          <div class="user">Ali</div>
        </header>

        <div class="cards">
          <div class="card">
            <span>Total products</span><strong id="totalProducts">...</strong>
          </div>
          <div class="card">
            <span>Low stock (5 or less)</span
            ><strong id="lowStockCount" class="warn">...</strong>
          </div>
          <div class="card">
            <span>Purchases this month</span
            ><strong id="monthPurchases">...</strong>
          </div>
          <div class="card">
            <span>Sales this month</span
            ><strong id="monthSales">...</strong>
          </div>
        </div>

        <div class="panel">
          <h3>Recent activity</h3>
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Product</th>
                <th>Qty</th>
                <th>Amount</th>
              </tr>
            </thead>
            <tbody id="activityTableBody">
              <tr>
                <td colspan="5">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <script type="module" src="js/dashboard.js"></script>
  </body>
</html>
