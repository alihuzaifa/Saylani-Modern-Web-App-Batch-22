<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Uploader</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/uploader.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-brand">File Uploader</div>
        <nav>
          <button type="button" id="navFiles" class="nav-link active">My Files</button>
          <button type="button" id="navImages" class="nav-link">Images</button>
          <button type="button" id="navDocs" class="nav-link">Documents</button>
          <button type="button" id="navVideos" class="nav-link">Videos</button>
        </nav>
        <button type="button" id="logoutBtn" class="nav-link logout">Log out</button>
      </aside>

      <div id="sidebarOverlay" class="overlay"></div>

      <main class="main">
        <header class="topbar">
          <button type="button" id="menuToggle" class="menu-toggle">&#9776;</button>
          <h1 id="pageTitle">My Files</h1>
          <div class="user" id="userEmail">user@example.com</div>
        </header>

        <!-- Stats -->
        <div class="cards">
          <div class="card">
            <span>Total files</span>
            <strong id="statTotal">0</strong>
          </div>
          <div class="card">
            <span>Total size</span>
            <strong id="statSize">0 KB</strong>
          </div>
          <div class="card">
            <span>Images</span>
            <strong id="statImages">0</strong>
          </div>
          <div class="card">
            <span>Documents</span>
            <strong id="statDocs">0</strong>
          </div>
        </div>

        <!-- Upload zone -->
        <div class="panel">
          <h3>Upload Files</h3>
          <div id="dropZone" class="drop-zone">
            <div class="drop-icon">&#128196;</div>
            <p class="drop-title">Drag &amp; drop files here</p>
            <p class="drop-sub">or</p>
            <label class="btn btn-primary browse-btn">
              Browse Files
              <input type="file" id="fileInput" multiple hidden />
            </label>
            <p class="drop-hint">Any file type &bull; Max 50 MB each</p>
          </div>

          <!-- Upload queue -->
          <div id="uploadQueue" class="upload-queue hidden"></div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search files..."
          />
          <div class="btn-group">
            <button type="button" id="deleteSelectedBtn" class="btn btn-delete hidden">
              Delete selected
            </button>
          </div>
        </div>

        <!-- Files table -->
        <div class="panel">
          <h3>
            Files
            <span id="fileCount" class="file-count">0</span>
          </h3>
          <table>
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAll" /></th>
                <th>Name</th>
                <th>Type</th>
                <th>Size</th>
                <th>Uploaded</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="fileTableBody">
              <tr>
                <td colspan="6" class="empty-row">No files yet. Upload something above.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <script type="module" src="js/uploader.js"></script>
  </body>
</html>
