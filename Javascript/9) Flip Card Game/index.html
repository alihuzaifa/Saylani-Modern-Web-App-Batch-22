<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip Card Game</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game">
      <div class="card">
        <img
          src="images/back.jfif"
          alt="Back Card"
          class="card-image animate__animated"
          id="card1"
        />
      </div>
      <div class="card">
        <img
          src="images/back.jfif"
          alt="Back Card"
          class="card-image animate__animated"
          id="card2"
        />
      </div>
      <div class="card">
        <img
          src="images/back.jfif"
          alt="Back Card"
          class="card-image animate__animated"
          id="card3"
        />
      </div>
    </div>

    <button class="play-btn" onclick="flipCards()">▶ Play Game</button>

    <script src="app.js"></script>
  </body>
</html>
