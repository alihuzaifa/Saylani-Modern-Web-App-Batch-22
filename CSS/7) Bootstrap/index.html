    <!-- Layout Form -->
    <form action="#" method="post" class="row g-3">
        <div class="col-md-6">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                <label for="floatingInput">Email address</label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-floating">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Password</label>
            </div>
        </div>
        <div class="col-12">
            <div class="form-floating">
                <input type="text" class="form-control" id="floatingAddress" placeholder="Address">
                <label for="floatingAddress">Address</label>
            </div>
        </div>
        <div class="col-12">
            <div class="form-floating">
                <input type="text" class="form-control" id="floatingAddress2" placeholder="Address2">
                <label for="floatingAddress2">Address2</label>
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-floating">
                <input type="text" class="form-control" id="floatingCity" placeholder="City">
                <label for="floatingCity">City</label>
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-floating">
                <select class="form-select" id="floatingState" aria-label="Floating label select example">
                    <option selected>Sindh</option>
                    <option value="1">Punjab</option>
                    <option value="2">KPK</option>
                    <option value="3">Balochistan</option>
                </select>
                <label for="floatingState">Select State</label>
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-floating">
                <input type="number" class="form-control" id="floatingZipCode" placeholder="Zip Code">
                <label for="floatingZipCode">Zip Code</label>
            </div>
        </div>
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="gridCheck">
                <label class="form-check-label" for="gridCheck">
                    Check me out
                </label>
            </div>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Sign in</button>
        </div>
    </form>
